# ===========================================================================
# Tess 预警 API · 生产 Nginx 反向代理
# ---------------------------------------------------------------------------
# 用途：Teensing 前端/后端调用「自己域名」的 /tess/* 时，由本 Nginx 转发到
#       Tess 服务，并自动注入 X-API-Key（密钥不落到前端代码里）。
#       dev 环境用 Vite 代理；生产部署用本段（放进 Teensing 站点的 server {} 内）。
#
# 替换占位符：
#   <TESS_HOST>   : Tess 服务可达地址（宿主 IP 或 docker 网关，如 172.17.0.1 / 内网 IP）
#   <TESS_API_KEY>: 与 Tess 启动时 TESS_API_KEY 完全一致的值
# ===========================================================================

# /tess/* 整段转发到 Tess
location /tess/ {
    # ---- 安全（强烈建议）----
    # 该接口带写入（POST /tess/alerts/{id}/ack），不应裸露公网。
    # 只允许 Teensing 后端/内网访问，取消注释并改成实际来源 IP：
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # deny  all;

    # 注入共享 API Key（Tess 端按 X-API-Key 校验；前端无需、也不应持有此值）
    proxy_set_header X-API-Key "<TESS_API_KEY>";

    # 转发到 Tess（保留 /tess/ 路径前缀）
    proxy_pass http://<TESS_HOST>:8080/tess/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}

# 单独处理 /tess（无尾斜杠）重定向，避免 404
location = /tess {
    return 301 /tess/;
}
