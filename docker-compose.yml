# Tess 诊断服务 —— 独立部署
# 用法：在项目根目录执行  docker compose up --build -d
# LLM Key 通过宿主机环境变量注入（绝不写进镜像或仓库）
#
# 前置：在宿主机 export TESS_LLM_API_KEY=sk-xxx   （或建一个 .env 文件，见 DEPLOY.md）

services:
  tess:
    build: .
    container_name: tess-diagnose
    ports:
      - "${TESS_PORT:-8080}:8080"
    environment:
      TESS_PORT: "8080"
      TESS_LLM_API_KEY: "${TESS_LLM_API_KEY}"
      TESS_LLM_BASE_URL: "${TESS_LLM_BASE_URL:-https://api.deepseek.com}"
      TESS_LLM_MODEL: "${TESS_LLM_MODEL:-deepseek-chat}"
      # JSONL 持久化路径（落在挂载卷内，容器重建不丢数据）
      TESS_FEEDBACK_PATH: "/data/feedback.jsonl"
      TESS_REMEDIATION_PATH: "/data/remediation.jsonl"
      # P7 定时预警调度（默认关闭；置 true 后每小时自动拉异常→诊断→存预警库）
      TESS_SCHEDULE_ENABLED: "${TESS_SCHEDULE_ENABLED:-false}"
      TESS_SCHEDULE_INTERVAL: "${TESS_SCHEDULE_INTERVAL:-3600}"
      TESS_SCHEDULE_LIMIT: "${TESS_SCHEDULE_LIMIT:-20}"
      TESS_SYSTEM_TOKEN: "${TESS_SYSTEM_TOKEN:-}"
    volumes:
      - tess-data:/data
    restart: unless-stopped
    healthcheck:
      # 调 /healthz（不依赖 LLM，纯进程探针）
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tess-data:
